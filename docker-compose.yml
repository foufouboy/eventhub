
services:

  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - 5173:5173
    volumes:
      - ./client:/app
      - /app/node_modules

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - postgres
      - mongodb
      - redis
    command: npm run dev

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    environment: 
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports: 
      - "27017:27017"
    volumes: 
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "81:80"
    volumes: 
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  postgres_data:
  mongodb_data:
  redis_data:
