events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend:3000;

            proxy_set_header Host ;
            proxy_set_header X-Real-IP ;
        }

        location / {
            proxy_pass http://frontend:5173;

            proxy_set_header Host ;
            proxy_set_header X-Real-IP ;
        }
    }
}

